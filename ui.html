<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساحة العمل الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================== الرموز التصميمية ===================== */

  :root {
    /* الأسطح — رمادي محايد، لا تدرّجات ثقيلة */
    --bg:         #0e1014;
    --surface:    #16191f;
    --surface-2:  #1c2028;
    --surface-3:  #232833;
    --border:     #262b34;
    --border-2:   #343b47;

    /* النص */
    --text:       #e6e9ef;
    --strong:     #f5f7fa;
    --muted:      #9aa3b2;
    --dim:        #6b7382;

    /* لون واحد أساسي — الإفراط في الألوان يشتّت */
    --accent:     #5b7cfa;
    --accent-dim: #3f5bc4;
    --accent-bg:  rgba(91,124,250,.10);
    --accent-br:  rgba(91,124,250,.28);

    /* حالات */
    --ok:      #3fb984;  --ok-bg:   rgba(63,185,132,.10);  --ok-br:   rgba(63,185,132,.26);
    --warn:    #d9a441;  --warn-bg: rgba(217,164,65,.10);  --warn-br: rgba(217,164,65,.26);
    --danger:  #e06c6c;  --dan-bg:  rgba(224,108,108,.10); --dan-br:  rgba(224,108,108,.26);
    --info:    #4fa8c4;  --info-bg: rgba(79,168,196,.10);  --info-br: rgba(79,168,196,.26);

    /* المسافات — سلّم ثابت */
    --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
    --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px;

    /* الاستدارة */
    --r1: 6px;  --r2: 10px; --r3: 14px; --r4: 18px;

    /* الظل — خفيف، لا توهّج */
    --sh1: 0 1px 2px rgba(0,0,0,.24);
    --sh2: 0 4px 12px rgba(0,0,0,.28);
    --sh3: 0 12px 32px rgba(0,0,0,.36);

    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;

    --nav-w: 248px;
    --topbar-h: 60px;
  }

  [data-theme="light"] {
    --bg:         #f7f8fa;
    --surface:    #ffffff;
    --surface-2:  #f2f4f7;
    --surface-3:  #e9ecf1;
    --border:     #e2e6ec;
    --border-2:   #cfd5de;

    --text:       #1f242d;
    --strong:     #0d1117;
    --muted:      #5b6472;
    --dim:        #858d9a;

    --accent:     #3a5bd9;
    --accent-dim: #2d48b0;
    --accent-bg:  rgba(58,91,217,.07);
    --accent-br:  rgba(58,91,217,.22);

    --ok:      #1f8f61;  --ok-bg:   rgba(31,143,97,.08);
    --warn:    #a8762a;  --warn-bg: rgba(168,118,42,.08);
    --danger:  #c0453f;  --dan-bg:  rgba(192,69,63,.08);
    --info:    #2b7f99;  --info-bg: rgba(43,127,153,.08);

    --sh1: 0 1px 2px rgba(16,24,40,.05);
    --sh2: 0 4px 12px rgba(16,24,40,.07);
    --sh3: 0 12px 32px rgba(16,24,40,.10);
  }

  /* ===================== الأساس ===================== */

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea, select { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 20px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  ::-webkit-scrollbar-track { background: transparent; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  code, pre, .ltr { direction: ltr; text-align: left; font-family: var(--mono); }

  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse   { 0%,100% { opacity: .45; } 50% { opacity: .85; } }
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes dots    { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ===================== النصوص ===================== */

  .h1 { font: 600 22px/1.35 var(--sans); color: var(--strong); letter-spacing: -.01em; }
  .h2 { font: 600 17px/1.4  var(--sans); color: var(--strong); }
  .h3 { font: 600 14px/1.45 var(--sans); color: var(--strong); }
  .body { font: 400 14px/1.7 var(--sans); color: var(--text); }
  .sm  { font: 400 13px/1.6 var(--sans); color: var(--muted); }
  .xs  { font: 400 12px/1.5 var(--sans); color: var(--dim); }
  .num { font: 300 30px/1.15 var(--sans); color: var(--strong); letter-spacing: -.02em; }
  .label {
    display: block; font: 600 11px/1 var(--sans); letter-spacing: .06em;
    color: var(--dim); text-transform: uppercase; margin-bottom: var(--s2);
  }

  /* ===================== المكوّنات ===================== */

  /* --- الأزرار --- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    padding: 9px 15px; border-radius: var(--r2); border: 1px solid var(--border-2);
    background: var(--surface-2); color: var(--text);
    font: 500 13.5px/1 var(--sans); white-space: nowrap;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover  { background: var(--surface-3); border-color: var(--dim); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:disabled:hover { background: var(--surface-2); border-color: var(--border-2); }

  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn.ghost   { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.ok      { color: var(--ok); border-color: var(--ok-br); background: var(--ok-bg); }
  .btn.danger  { color: var(--danger); border-color: var(--dan-br); background: var(--dan-bg); }
  .btn.sm      { padding: 6px 11px; font-size: 12.5px; border-radius: var(--r1); }
  .btn.block   { width: 100%; }
  .btn.icon    { padding: 7px; width: 32px; height: 32px; }

  /* --- البطاقات --- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r3); padding: var(--s5);
  }
  .card.flat  { background: var(--surface-2); }
  .card.pad-0 { padding: 0; overflow: hidden; }
  .card-head {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--border);
  }
  .card-head .grow { flex: 1; min-width: 0; }
  .card-body { padding: var(--s5); }

  /* --- بطاقة مؤشر --- */
  .metric { display: flex; flex-direction: column; gap: var(--s2); }
  .metric .k { font: 500 12px/1 var(--sans); color: var(--muted); }
  .metric .v { font: 300 28px/1.15 var(--sans); color: var(--strong); letter-spacing: -.02em; }
  .metric .d { font: 400 11.5px/1.4 var(--sans); color: var(--dim); }
  .metric.accent .v { color: var(--accent); }
  .metric.ok .v     { color: var(--ok); }
  .metric.warn .v   { color: var(--warn); }

  /* --- شارات الحالة --- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px;
    font: 500 11.5px/1.5 var(--sans); white-space: nowrap;
    border: 1px solid var(--border-2); color: var(--muted); background: var(--surface-2);
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.pending   { color: var(--warn);   border-color: var(--warn-br); background: var(--warn-bg); }
  .badge.approved  { color: var(--ok);     border-color: var(--ok-br);   background: var(--ok-bg); }
  .badge.rejected  { color: var(--danger); border-color: var(--dan-br);  background: var(--dan-bg); }
  .badge.cancelled { color: var(--dim); }
  .badge.info      { color: var(--info);   border-color: var(--info-br); background: var(--info-bg); }
  .badge.accent    { color: var(--accent); border-color: var(--accent-br); background: var(--accent-bg); }
  .badge.plain::before { display: none; }

  /* --- بطاقة إجراء --- */
  .action {
    display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: right;
    padding: var(--s4); border-radius: var(--r2);
    border: 1px solid var(--border); background: var(--surface);
    transition: border-color .15s, background .15s;
  }
  .action:hover { border-color: var(--accent-br); background: var(--accent-bg); }
  .action .ic {
    width: 34px; height: 34px; flex: none; border-radius: var(--r2);
    display: grid; place-items: center; font-size: 15px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .action .tx { flex: 1; min-width: 0; }
  .action .t  { font: 600 13.5px/1.4 var(--sans); color: var(--text); }
  .action .s  { font: 400 12px/1.5 var(--sans); color: var(--dim); margin-top: 2px; }

  /* --- الجداول --- */
  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: right; padding: var(--s3) var(--s4);
    font: 600 11.5px/1 var(--sans); letter-spacing: .04em; color: var(--dim);
    text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .table td {
    padding: var(--s4); border-bottom: 1px solid var(--border);
    font: 400 13.5px/1.5 var(--sans); vertical-align: middle;
  }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr:hover { background: var(--surface-2); }
  .table .nowrap { white-space: nowrap; }
  .table .end { text-align: left; }

  /* --- الخط الزمني --- */
  .timeline { position: relative; padding-right: var(--s5); }
  .timeline::before {
    content: ""; position: absolute; top: 6px; bottom: 6px; right: 5px;
    width: 1px; background: var(--border);
  }
  .tl-item { position: relative; padding-bottom: var(--s5); }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: ""; position: absolute; right: -19px; top: 6px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--border-2);
  }
  .tl-item.ok::before      { border-color: var(--ok); }
  .tl-item.warn::before    { border-color: var(--warn); }
  .tl-item.danger::before  { border-color: var(--danger); }
  .tl-item .t  { font: 500 13px/1.5 var(--sans); }
  .tl-item .ts { font: 400 11.5px/1 var(--mono); color: var(--dim); margin-top: 3px; }

  /* --- الحالات: فارغ · تحميل · خطأ --- */
  .state { padding: var(--s7) var(--s5); text-align: center; }
  .state .ic { font-size: 26px; opacity: .4; margin-bottom: var(--s3); }
  .state .t  { font: 600 14px/1.5 var(--sans); color: var(--muted); }
  .state .s  { font: 400 13px/1.6 var(--sans); color: var(--dim); margin-top: var(--s2); }
  .state .btn { margin-top: var(--s4); }
  .state.error .t { color: var(--danger); }

  .skel {
    background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2));
    background-size: 200% 100%; border-radius: var(--r1);
    animation: pulse 1.4s ease-in-out infinite; height: 13px; margin-bottom: var(--s2);
  }
  .skel.w-40 { width: 40%; } .skel.w-60 { width: 60%; } .skel.w-80 { width: 80%; }
  .skel.tall { height: 46px; border-radius: var(--r2); }

  .spinner {
    width: 15px; height: 15px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--border-2); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }

  /* --- نافذة الحوار --- */
  .overlay {
    position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
    padding: var(--s5); background: rgba(6,8,12,.62); backdrop-filter: blur(3px);
    animation: fade-in .16s ease both;
  }
  .dialog {
    width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r4); box-shadow: var(--sh3);
  }
  .dialog.wide { max-width: 700px; }
  .dialog-head {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s5) var(--s5) var(--s3);
  }
  .dialog-head .h2 { flex: 1; }
  .dialog-body { padding: 0 var(--s5) var(--s5); }
  .dialog-foot {
    display: flex; gap: var(--s2); justify-content: flex-start;
    padding: var(--s4) var(--s5); border-top: 1px solid var(--border);
  }

  /* --- الحقول --- */
  .field { margin-bottom: var(--s4); }
  .input, .select, .textarea {
    width: 100%; padding: 10px 13px; border-radius: var(--r2);
    border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text);
    outline: none; transition: border-color .15s;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
  .input::placeholder { color: var(--dim); }
  .select { cursor: pointer; }
  .textarea { resize: vertical; min-height: 74px; line-height: 1.6; }

  .seg { display: flex; gap: var(--s1); padding: var(--s1); border-radius: var(--r2); background: var(--surface-2); border: 1px solid var(--border); }
  .seg button { flex: 1; padding: 7px 10px; border: 0; border-radius: var(--r1); background: transparent; color: var(--muted); font: 500 12.5px/1 var(--sans); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--sh1); }

  /* --- الإشعارات العائمة --- */
  .toasts { position: fixed; bottom: var(--s5); left: var(--s5); z-index: 300; display: flex; flex-direction: column; gap: var(--s2); }
  .toast {
    display: flex; align-items: center; gap: var(--s3); min-width: 240px; max-width: 380px;
    padding: 11px 15px; border-radius: var(--r2);
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh2);
    font: 500 13px/1.5 var(--sans); animation: fade-in .2s ease both;
  }
  .toast.ok   { border-color: var(--ok-br);  color: var(--ok); }
  .toast.err  { border-color: var(--dan-br); color: var(--danger); }

  /* --- شبكات --- */
  .grid { display: grid; gap: var(--s4); }
  .g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .row { display: flex; align-items: center; gap: var(--s3); }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: var(--s4); }
  /* يُعيد الحاشية داخل بطاقة pad-0 — تُستخدم في الهيكل التنظيمي */
  .pad { padding: var(--s4); }
  .stack.tight { gap: var(--s2); }
  .trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===================== التخطيط ===================== */

  #shell { display: flex; height: 100%; overflow: hidden; }

  /* --- التنقّل الجانبي --- */
  nav.side {
    width: var(--nav-w); flex: none; height: 100%; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border-left: 1px solid var(--border);
  }
  .brand { flex: none; display: flex; align-items: center; gap: var(--s3); padding: var(--s5) var(--s5) var(--s4); }
  .brand .mark {
    width: 32px; height: 32px; flex: none; border-radius: var(--r2);
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font: 700 14px/1 var(--sans);
  }
  .brand .nm { font: 600 14.5px/1.2 var(--sans); color: var(--strong); }
  .brand .sb { font: 400 11px/1 var(--sans); color: var(--dim); margin-top: 3px; }

  .nav-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 var(--s3) var(--s3); }
  .nav-group { margin-bottom: var(--s4); }
  .nav-group > .label { padding: 0 var(--s3); margin-bottom: var(--s2); }

  .nav-item {
    display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: right;
    padding: 9px var(--s3); margin-bottom: 2px; border-radius: var(--r2);
    border: 0; background: transparent; color: var(--muted);
    font: 500 13.5px/1.4 var(--sans); transition: background .15s, color .15s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.on { background: var(--accent-bg); color: var(--accent); }
  .nav-item .ic { width: 18px; flex: none; text-align: center; font-size: 14px; opacity: .85; }
  .nav-item .tx { flex: 1; min-width: 0; }
  .nav-item .ct {
    font: 600 11px/1 var(--sans); padding: 3px 7px; border-radius: 10px;
    background: var(--accent); color: #fff;
  }

  .nav-foot { flex: none; border-top: 1px solid var(--border); padding: var(--s3); }
  .who { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r2); }
  .who .av {
    width: 30px; height: 30px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font: 600 12px/1 var(--sans);
    background: var(--surface-3); color: var(--text);
  }
  .who .nm { font: 600 12.5px/1.3 var(--sans); }
  .who .rl { font: 400 11px/1 var(--sans); color: var(--dim); margin-top: 2px; }

  /* --- منطقة المحتوى --- */
  main.work { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    flex: none; height: var(--topbar-h);
    display: flex; align-items: center; gap: var(--s4);
    padding: 0 var(--s6); border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .topbar .title { font: 600 15px/1.3 var(--sans); color: var(--strong); }
  .topbar .sub   { font: 400 12px/1 var(--sans); color: var(--dim); margin-top: 2px; }
  .topbar .menu { display: none; }

  .page { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .page-in { max-width: 1120px; margin: 0 auto; padding: var(--s6); }
  .page-in.full { max-width: none; }

  /* --- المساعد: تخطيط خاص --- */
  .chat-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .chat-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .chat-in { max-width: 780px; margin: 0 auto; padding: var(--s6) var(--s5) var(--s2); display: flex; flex-direction: column; gap: var(--s5); }

  .turn { animation: fade-in .3s ease both; }
  .turn.me { display: flex; justify-content: flex-start; }
  .bubble {
    max-width: 76%; padding: 11px 15px; border-radius: var(--r3) var(--r1) var(--r3) var(--r3);
    background: var(--accent-bg); border: 1px solid var(--accent-br);
    font: 400 14px/1.75 var(--sans); white-space: pre-wrap;
  }
  .from { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
  .from .av { width: 22px; height: 22px; border-radius: var(--r1); background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 10px/1 var(--sans); }
  .from .nm { font: 600 12.5px/1 var(--sans); }
  .from .ts { font: 400 11px/1 var(--mono); color: var(--dim); }

  .answer { font: 400 14.5px/1.85 var(--sans); white-space: pre-wrap; }
  .steps { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s3); }
  .step {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 20px;
    font: 500 11.5px/1.5 var(--sans); color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .step.run::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
  .step.done::before { content: "✓"; color: var(--ok); font-size: 10px; }

  .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); animation: dots 1.3s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }

<script>
/* ===================== النواة ===================== */

const API = window.API_BASE || "http://localhost:8000";
const $  = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);

/* التخزين متسامح — localStorage قد يُحجب داخل iframe */
const store = {
  mem: {},
  get(k, fb) {
    try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); }
    catch (e) { return k in this.mem ? this.mem[k] : fb; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { this.mem[k] = v; }
  },
};

const state = {
  token: store.get("token", ""),
  user:  store.get("user", null),
  route: "home",
  mode:  "agent",
  busy:  false,
  pending: [],
  pendingCount: 0,
  connTimer: null,
  myLeave: null,
  myRequests: [],
  sessions: store.get("sessions", []),
  currentId: null,
};

/* ===================== بوّابات الدور =====================
   ثلاث دوال تطابق auth.py حرفاً بحرف:

     isAdmin    ↔ auth.is_admin      (admin فقط)
     isManager  ↔ auth.is_manager    (manager فقط — لا يشمل admin)
     isElevated ↔ auth.is_elevated   (manager أو admin)

   الإخفاء هنا تحسين للتجربة لا حدّ أمني: كل مسار محميّ يرفض
   في الخادم بذاته، فتعديل هذا الملف لا يمنح شيئاً.

   كانت هذه الدالة الواحدة `role === "manager"` فحُجب المسؤول عن
   كل شيء إداري، وعُرض على المدير ما يرفضه الخادم (/stats و
   /auth/users صارا is_admin في الخطوتين 1 و3.1). */

const isAdmin    = () => !!state.user && state.user.role === "admin";
const isManager  = () => !!state.user && state.user.role === "manager";
const isElevated = () => isAdmin() || isManager();

/* القدرات التي قد تحملها وجهة أو إجراء. غياب القدرة = متاح للجميع. */
const CAPABILITY = { elevated: isElevated, admin: isAdmin };
const allowed = cap => !cap || (CAPABILITY[cap] ? CAPABILITY[cap]() : false);

/* تسمية الدور — ثلاثية. كانت ثنائية فظهر المسؤول "موظف". */
const ROLE_LABEL = { admin: "مسؤول النظام", manager: "مدير", employee: "موظف" };
const ROLE_TONE  = { admin: "accent", manager: "approved", employee: "info" };
const roleLabel  = r => ROLE_LABEL[r] || "موظف";
const roleTone   = r => ROLE_TONE[r] || "info";
const roleChip   = r =>
  '<span class="badge ' + roleTone(r) + '">' + esc(roleLabel(r)) + "</span>";

/* ===================== هوية المستخدم =====================
   /auth/me يعيد أحد عشر حقلاً منذ الخطوة 5، وكانت الواجهة تقرأ
   ثلاثة. نقرؤها كلها في شكل واحد، فيستوي مصدرها: /auth/login
   (أربعة حقول، المعرّف اسمه employee_id) أو /auth/me (المعرّف id).

   الدور من الخادم وحده — لا يُقرأ من التخزين المحلي عند الإقلاع
   إلا بعد أن يؤكّده /auth/me. */

function adoptUser(src) {
  const u = {
    name:              src.name || "",
    role:              src.role || "",
    id:                src.id || src.employee_id || "",
    department:        src.department || "",
    department_id:     src.department_id || "",
    job_title:         src.job_title || "",
    manager_id:        src.manager_id || "",
    manager_name:      src.manager_name || "",
    employment_status: src.employment_status || "",
    email:             src.email || "",
    hire_date:         src.hire_date || "",
  };
  state.user = u;
  store.set("user", u);
  return u;
}

async function refreshMe() {
  try {
    const r = await fetch(API + "/auth/me", {
      headers: { Authorization: "Bearer " + state.token },
    });
    if (!r.ok) return false;
    adoptUser(await r.json());
    return true;
  } catch (e) {
    return false;
  }
}

/* ===================== أسماء الأدوات المقروءة =====================
   المستخدم لا يرى get_leave_balance — يرى "جارٍ التحقق من رصيد إجازتك".
   الأسماء التقنية تبقى في السجلات للتشخيص. */

const TOOL_TEXT = {
  search_documents:          ["البحث في مستندات الشركة",   "بحث في المستندات"],
  get_employee:              ["جلب بيانات الموظف",          "بيانات الموظف"],
  get_leave_balance:         ["التحقق من رصيد الإجازة",     "رصيد الإجازة"],
  list_department_employees: ["استعراض موظفي القسم",        "موظفو القسم"],
  department_summary:        ["تجميع بيانات الأقسام",       "ملخّص الأقسام"],
  calculate:                 ["إجراء الحساب",               "حساب"],
  preview_leave_request:     ["تجهيز طلب الإجازة",          "معاينة الطلب"],
  submit_leave_request:      ["تسجيل طلب الإجازة",          "تسجيل الطلب"],
  cancel_leave_request:      ["إلغاء الطلب",                "إلغاء الطلب"],
  list_leave_requests:       ["استعراض طلباتك",             "عرض الطلبات"],
  list_pending_requests:     ["جلب الطلبات المعلّقة",        "الطلبات المعلّقة"],
  review_leave_request:      ["تنفيذ القرار",               "مراجعة الطلب"],

  /* أدوات الخطوة 6 — بلا تسمية كان toolDone يعرض الاسم الإنجليزي الخام
     وسط المحادثة، وكانت الأربعة تغيب عن مخطط "المصادر المستخدمة". */
  get_my_profile:            ["جلب بياناتك الوظيفية",       "بياناتك الوظيفية"],
  get_my_manager:            ["تحديد مديرك المباشر",        "مديرك المباشر"],
  get_my_team:               ["استعراض فريقك",              "فريقك"],

async function api(path, options) {
  const o = options || {};
  o.headers = Object.assign({}, o.headers, { Authorization: "Bearer " + state.token });

  const res = await fetch(API + path, o);
  if (res.status === 401) { signOut("انتهت الجلسة — سجّل دخولك من جديد."); throw new Error("انتهت الجلسة"); }
  return res;
}

async function apiJson(path, options) {
  const res = await api(path, options);
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error((data && data.detail) || ("خطأ " + res.status));
  return data;
}

  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.setAttribute("role", "dialog");
  wrap.setAttribute("aria-modal", "true");
  wrap.innerHTML =

          esc(opts.confirmLabel || "تأكيد") + "</button>" +
        '<button class="btn ghost" data-no>إلغاء</button>' +
      "</div>" +
    "</div>";

  document.body.appendChild(wrap);

}

/* ===================== طبقة البيانات =====================

   ثلاثة ضمانات:
   1. لا طلب مكرّر — الطلب الجاري يُشارَك بدل إطلاق آخر.
   2. لا جلب عند كل تنقّل — نتيجة حديثة تُعاد من الذاكرة.
   3. فشل مورد لا يُسقط غيره — كل واحد يحمل حالته وخطأه.
*/

const TTL_MS = 45000;

const resources = {
  leave:    { state: "idle", data: null, error: "", ts: 0 },
  requests: { state: "idle", data: [],   error: "", ts: 0 },
  pending:  { state: "idle", data: [],   error: "", ts: 0 },
  docs:     { state: "idle", data: [],   error: "", ts: 0 },
  decisions:{ state: "idle", data: [],   error: "", ts: 0 },
  team:     { state: "idle", data: [],   error: "", ts: 0 },
  attend:   { state: "idle", data: null, error: "", ts: 0 },
  teamAtt:  { state: "idle", data: [],   error: "", ts: 0 },
  corrects: { state: "idle", data: [],   error: "", ts: 0 },
  sites:    { state: "idle", data: [],   error: "", ts: 0 },
};

const inflight = {};

/* تحذير في الطرفية لا في الواجهة — المستخدم لا يرى تفاصيل التنفيذ */
const log = {
  malformed(key, value) {
    if (typeof console !== "undefined" && console.warn) {
      console.warn("مورد " + key + ": ردّ غير متوقّع، استُخدمت قائمة فارغة.", typeof value);
    }
  },
};

function loadResource(key, path, options) {
  const opts = options || {};
  const slot = resources[key];

  if (!opts.force && slot.state === "ready" && Date.now() - slot.ts < TTL_MS) {
    return Promise.resolve(slot);
  }
  if (inflight[key]) return inflight[key];

  slot.state = "loading";
  slot.error = "";

  inflight[key] = (async () => {
    try {
      const raw = await apiJson(path);
      let value = opts.transform ? opts.transform(raw) : raw;

      /* ردّ مشوّه لا يُسقط الصفحة: مورد قائمة يبقى قائمة مهما وصل */
      if (opts.asList && !Array.isArray(value)) {
        if (value != null) log.malformed(key, value);
        value = [];
      }

      slot.data = value;
      slot.state = "ready";
      slot.ts = Date.now();
    } catch (e) {
      slot.state = "error";
      slot.error = e.message;
    } finally {
      delete inflight[key];
    }
    return slot;
  })();

  return inflight[key];
}

/** يُبطل نتائج مخزّنة بعد عملية كتابة. */
function invalidate() {
  Array.prototype.forEach.call(arguments, k => {
    if (resources[k]) resources[k].ts = 0;
  });
}

function resetResources() {
  Object.keys(resources).forEach(k => {
    resources[k] = { state: "idle", data: k === "leave" ? null : [], error: "", ts: 0 };
  });
}

/* --- الموارد --- */

  loadResource("leave", "/me/leave", { force: force });

const loadRequests = force =>
  loadResource("requests", "/me/requests", { force: force, asList: true });

async function loadDecisions(force) {
  /* /leave/decisions بوّابته is_elevated — فالمسؤول مشمول */
  if (!isElevated()) {
    resources.decisions = { state: "ready", data: [], error: "", ts: Date.now() };
    return resources.decisions;
  }
  return loadResource("decisions", "/leave/decisions?limit=10",
                      { force: force, asList: true });
}


async function loadPending(force) {
  /* /leave/pending بوّابته is_elevated — فالمسؤول مشمول */
  if (!isElevated()) {
    resources.pending = { state: "ready", data: [], error: "", ts: Date.now() };
    state.pending = [];
    state.pendingCount = 0;
    return resources.pending;
  }

  const slot = await loadResource("pending", "/leave/pending", { force: force, asList: true });

  /* نُبقي state.pending لتوافق صفحة الموافقات القائمة */
  state.pending = slot.state === "ready" ? slot.data : [];
  state.pendingCount = state.pending.length;
  return slot;
}


/* /me/team — التقارير المباشرة وحدها، لا الشجرة.
   الخادم يعيد كائناً فيه members؛ نُسطّحه إلى قائمة ليتعامل معه
   بقية الواجهة كأي مورد قائمة، ويبقى transform مسؤولاً عن الشكل. */
async function loadTeam(force) {
  if (!isElevated()) {
    resources.team = { state: "ready", data: [], error: "", ts: Date.now() };
    return resources.team;
  }
  return loadResource("team", "/me/team", {
    force: force,
    asList: true,
    transform: r => (r && Array.isArray(r.members) ? r.members : []),
  });
}

const PAGES = {};

function go(route) {
  if (!ROUTES[route] || !visible(route)) route = "home";

  state.route = route;
  if (location.hash.replace("#", "") !== route) location.hash = route;

  const r = ROUTES[route];
  $("pgTitle").textContent = r.title;
  $("pgSub").textContent = r.sub || "";
  $("pgActions").innerHTML = "";

  const page = PAGES[route] || PAGES.home;
  $("view").innerHTML = page.render();
  renderNav();

  if (page.mount) {
    try { page.mount(); }
    catch (e) { $("view").innerHTML = errorState(e.message); }
  }
}

window.addEventListener("hashchange", () => {
  const r = location.hash.replace("#", "");
  if (r && r !== state.route) go(r);

function buildAttention() {
  const out = [];
  const R = resources.requests, P = resources.pending, L = resources.leave;

  if (isElevated() && P.state === "ready" && P.data.length) {
    out.push({
      tone: "info", icon: "✓",
      title: P.data.length + " طلب بانتظار مراجعتك",
      body: "أقدمها من " + esc(P.data[0].employee_name),
      go: "approvals", label: "مراجعة",
    });
  }

  if (R.state === "ready") {
    (R.data || []).filter(r => r.status === "approved").slice(0, 2).forEach(r =>
      out.push({
        tone: "ok", icon: "✓",
        title: "اعتُمد طلب إجازتك",
        body: fmtDate(r.start_date) + " · " + r.days + " أيام",
        go: "requests", label: "عرض",
      }));

    (R.data || []).filter(r => r.status === "rejected").slice(0, 2).forEach(r =>
      out.push({
        tone: "danger", icon: "✕",
        title: "رُفض طلب إجازتك",
        body: r.rejection_reason ? esc(r.rejection_reason)
                                 : fmtDate(r.start_date) + " · " + r.days + " أيام",
        go: "requests", label: "عرض",
      }));
  }

  if (L.state === "ready" && L.data && L.data.available <= 2) {
    out.push({
      tone: "warn", icon: "!",
      title: "رصيد إجازتك منخفض",
      body: "المتاح " + L.data.available + " يوماً فقط.",
      go: "workspace", label: "التفاصيل",
    });
  }

  return out;
}

const STATUS_ORDER = ["pending", "approved", "rejected", "cancelled"];
const LEAVE_TYPE_TEXT = { annual: "إجازة سنوية" };
const typeText = t => LEAVE_TYPE_TEXT[t] || t || "إجازة";

/* المرشّح في الحالة — لا يُفقد عند إعادة الرسم، ولا يستدعي الخادم */
let requestFilter = "all";

/* ===================== الحضور ===================== */

/* الموقع الجغرافي محجوب على http في كل المتصفّحات إلا من localhost.
   نكشفه صراحةً ونقول السبب: زرّ لا يستجيب أسوأ من زرّ غائب، ولو
   تركناه لظنّ المستخدم أن النظام معطّل. */
const geoReady = () =>
  typeof navigator !== "undefined" && !!navigator.geolocation &&
  (typeof isSecureContext === "undefined" || isSecureContext);

const GEO_BLOCKED =
  "تسجيل الحضور يحتاج اتصالاً آمناً (HTTPS). المتصفّح لا يعطي الموقع " +
  "على اتصال غير آمن إلا من localhost.";

/* رسائل أخطاء الموقع بلغة المستخدم لا برموز المواصفة */
const GEO_ERRORS = {
  1: "رُفض الإذن بالموقع. فعّله من إعدادات الموقع في المتصفّح.",
  2: "تعذّر تحديد موقعك. تأكّد من تفعيل خدمة الموقع في الجهاز.",
  3: "انتهت مهلة تحديد الموقع. حاول مرّة أخرى.",
};

function readPosition() {
  return new Promise((resolve, reject) => {
    if (!geoReady()) { reject(new Error(GEO_BLOCKED)); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        /* الثلاثة فقط. لا site_id ولا inside ولا distance_m:
           الحكم يحسبه الخادم، والمخطّط يُسقط أي ادّعاء نرسله. */
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy_m: pos.coords.accuracy,
      }),
      err => reject(new Error(GEO_ERRORS[err && err.code] ||
                              "تعذّر قراءة الموقع.")),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 },
    );
  });
}

/* نافذة آخر 30 يوماً. encodeURIComponent لازم: علامة + في الإزاحة
   تُفكّ مسافةً في مسار الاستعلام فيردّ الخادم 400. */
function attendanceWindow(days) {
  const now = new Date();
  const from = new Date(now.getTime() - (days || 30) * 86400000);
  return "?start=" + encodeURIComponent(from.toISOString().replace(/\.\d+Z$/, "+00:00")) +
         "&end=" + encodeURIComponent(new Date(now.getTime() + 86400000)
                     .toISOString().replace(/\.\d+Z$/, "+00:00"));
}

function loadAttendance(force) {
  return loadResource("attend", "/me/attendance" + attendanceWindow(30),
                      { force: force });
}

const VERDICT_TEXT = {
  inside: "داخل النطاق",
  outside: "خارج النطاق",
  rejected: "قراءة غير دقيقة",
  manually_added: "أُضيف إدارياً",
  correction_closed: "أُغلق بتصحيح",
  conflict_closed: "أُغلق لتعارض",
};

const verdictTone = v =>
  v === "inside" ? "ok" : (v === "outside" || v === "rejected") ? "warn" : "muted";

const verdictChip = v =>
  '<span class="badge ' + verdictTone(v) + '">' +
  esc(VERDICT_TEXT[v] || v || "—") + "</span>";

/* الساعات بصيغة يقرأها إنسان. null ليست صفراً: جلسة بلا مدّة
   محسوبة تختلف عن جلسة مدّتها صفر، والفرق يهمّ في كشف الساعات. */
const fmtMinutes = m => {
  if (m == null) return "—";
  const h = Math.floor(m / 60), r = m % 60;
  return h ? (r ? h + " س " + r + " د" : h + " س") : r + " د";
};

const fmtClock = s => {
  if (!s) return "—";
  try {
    const d = new Date(s);
    /* التاريخ التالف لا يرمي — يعيد "Invalid Date" نصّاً.
       فالفحص الصريح لازم، وإلا ظهرت العبارة الإنجليزية للمستخدم. */
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return "—"; }
};

            (open.site_name ? " — " + esc(open.site_name) : "") + "</div>"
          : '<div class="xs">سجّل حضورك عند وصولك لموقع العمل.</div>') +
        action +
      "</div>" +
    "</div>";

  const btn = $("atAction");
  if (btn) btn.onclick = () => submitAttendance(open ? "check-out" : "check-in", btn);
}

async function submitAttendance(kind, btn) {
  btn.disabled = true;
  btn.textContent = "جارٍ قراءة الموقع…";
  try {
    const reading = await readPosition();
    const r = await apiJson("/attendance/" + kind, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(reading),
    });

    if (!r.recorded) { toast(r.reason || "لم يُسجَّل", "warn"); }
    else if (r.accepted === false) {
      /* سُجّل ولم يُقبل — حالة قائمة بذاتها لا نجاح ولا فشل.
         الصراحة هنا أهمّ من الطمأنة: الموظف يحتاج أن يعرف
         أن عليه طلب تصحيح. */
      toast("سُجّلت المحاولة: " + esc(VERDICT_TEXT[r.verdict] || r.verdict) +
            ". تقدر تطلب تصحيحاً.", "warn");
    } else {
      toast(kind === "check-in" ? "سُجّل حضورك" : "سُجّل انصرافك", "ok");
    }
  } catch (e) {
    toast(e.message, "err");
  } finally {
    btn.disabled = false;
    await loadAttendance(true).catch(() => resources.attend);
    if (state.route === "attendance") {
      renderAttStatus(); renderAttTotals(); renderAttLog();
    }
  }
}

/* أنواع التصحيح. القوائم تُشتقّ من مفردات الخادم لا من نصّ حرّ:
   قيمة لا يعرفها الخادم تُرفض 400، والمستخدم لا يفهم السبب. */
const CORRECTION_KINDS = [
  { v: "missing_check_in",  t: "نسيت تسجيل الحضور",  needs: ["in", "out"] },
  { v: "missing_check_out", t: "نسيت تسجيل الانصراف", needs: ["out"] },
  { v: "wrong_time",        t: "الوقت المسجّل خاطئ",  needs: ["in", "out"] },
  { v: "rejected_location", t: "رفض النظام موقعي",   needs: ["out"] },
  { v: "other",             t: "سبب آخر",            needs: [] },
];

/* إدخال وقت محلّي ← ISO بإزاحة صريحة. الخادم يرفض الطابع بلا
   إزاحة، وهذا مقصود: "08:00" بلا منطقة ليست لحظة بل نيّة. */
function localToIso(value) {
  if (!value) return null;
  const d = new Date(value);
  if (isNaN(d.getTime())) return null;
  d.setSeconds(0, 0);
  return d.toISOString().replace(/\.\d+Z$/, "+00:00");
}

function openCorrection(recordId) {
  const kindOptions = CORRECTION_KINDS
    .map(k => '<option value="' + k.v + '">' + esc(k.t) + "</option>").join("");

  openDialog({
    title: "طلب تصحيح",
    body:
      '<div class="stack tight">' +
        '<label class="field"><span class="lb">نوع التصحيح</span>' +
          '<select id="cxKind" class="in">' + kindOptions + "</select></label>" +
        '<label class="field" id="cxInWrap"><span class="lb">وقت الحضور الصحيح</span>' +
          '<input id="cxIn" type="datetime-local" class="in ltr"></label>' +
        '<label class="field" id="cxOutWrap"><span class="lb">وقت الانصراف الصحيح</span>' +
          '<input id="cxOut" type="datetime-local" class="in ltr"></label>' +
        '<label class="field"><span class="lb">السبب</span>' +
          '<textarea id="cxWhy" class="in" rows="3" ' +
            'placeholder="اشرح ما حدث"></textarea></label>' +
      "</div>",
    confirmLabel: "إرسال الطلب",
    onReady() {
      const sync = () => {
        const k = CORRECTION_KINDS.find(x => x.v === $("cxKind").value);
        const needs = (k && k.needs) || [];
        $("cxInWrap").style.display = needs.indexOf("in") >= 0 ? "" : "none";
        $("cxOutWrap").style.display = needs.indexOf("out") >= 0 ? "" : "none";
      };
      $("cxKind").onchange = sync;
      sync();
    },
    async onConfirm() {
      const kind = $("cxKind").value;
      const body = { kind: kind, record_id: recordId || null,
                     reason: $("cxWhy").value.trim() };

      const inIso = localToIso($("cxIn").value);
      const outIso = localToIso($("cxOut").value);
      if (inIso) body.requested_check_in_at = inIso;
      if (outIso) body.requested_check_out_at = outIso;

      try {
        await apiJson("/attendance/corrections", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        toast("أُرسل طلب التصحيح — ينتظر مراجعة مديرك", "ok");
        await loadAttendance(true).catch(() => resources.attend);
        if (state.route === "attendance") renderAttLog();
      } catch (e) {
        /* يبقى الحوار مفتوحاً: المستخدم كتب نصّاً ولا يُفقد بالإغلاق */
        toast(e.message, "err");
        return false;
      }
    },
  });
}

/* --- تفاصيل الطلب --- */

function showRequestDetails(id) {
  const r = findRequest(id);
  if (!r) { toast("تعذّر العثور على الطلب", "err"); return; }

  const row = (label, value) =>
    '<tr><td class="sm w-label">' + esc(label) + "</td><td>" + value + "</td></tr>";

  const decided = r.status === "approved" || r.status === "rejected";

  const body =
    '<div class="table-wrap"><table class="table compact"><tbody>' +
      row("رقم الطلب", '<span class="ltr">' + r.id + "</span>") +
      row("النوع", esc(typeText(r.leave_type))) +
      row("الفترة", fmtDate(r.start_date) + " ← " + fmtDate(r.end_date)) +
      row("عدد الأيام", r.days) +
      row("الحالة", badge(r.status)) +
      row("قُدّم في", fmtStamp(r.created_at)) +
    "</tbody></table></div>" +

    '<div class="label mt-5">سبب الموظف</div>' +
    '<div class="quote">' + (r.reason ? esc(r.reason) : "لم يُذكر سبب.") + "</div>" +

    (decided
      ? '<div class="label mt-5">القرار</div>' +
        '<div class="table-wrap"><table class="table compact"><tbody>' +
          row("القرار", badge(r.status)) +
          (r.decided_at ? row("تاريخ القرار", fmtStamp(r.decided_at)) : "") +
          (r.decided_by_name ? row("اتخذه", esc(r.decided_by_name)) : "") +
        "</tbody></table></div>" +
        (r.decision_note
          ? '<div class="quote ' + (r.status === "rejected" ? "warn-quote" : "") + '">' +
            esc(r.decision_note) + "</div>"
          : '<div class="xs mt-2">بلا ملاحظة.</div>')
      : "") +

    (r.status === "cancelled" ? '<p class="xs mt-5">أُلغي هذا الطلب، وعادت أيامه لرصيدك.</p>' : "") +
    (r.status === "approved" ? '<p class="xs mt-5">خُصمت أيام هذا الطلب من رصيدك.</p>' : "");

  const wrap = openDialog({
    title: "تفاصيل الطلب",
    body: body,
    confirmLabel: r.can_cancel ? "إلغاء الطلب" : "إغلاق",
    danger: !!r.can_cancel,
    onConfirm: async () => {
      closeOverlay();
      if (r.can_cancel) confirmCancelRequest(r.id);
    },
  });

  /* زر "إلغاء" السفلي زائد حين لا يوجد إجراء */
  if (!r.can_cancel) {
    const dismiss = wrap.querySelectorAll(".dialog-foot [data-no]");
    dismiss.forEach(b => b.remove());
  }
}

/* --- الإلغاء --- */

function confirmCancelRequest(id) {
  const r = findRequest(id);
  if (!r) return;

  /* الزر لا يظهر إلا بـ can_cancel من الخادم — والخادم يفحص مجدداً */
  confirmDialog(
    "إلغاء الطلب",
    "سيُلغى الطلب رقم <b>" + r.id + "</b> (" + r.days + " أيام، " +
      fmtDate(r.start_date) + " ← " + fmtDate(r.end_date) + ").<br>" +
      "تعود أيامه لرصيدك المتاح، ولا يمكن التراجع عن الإلغاء.",
    "تأكيد الإلغاء",
    async () => {
      try {
        const d = await apiJson("/leave/" + id + "/cancel", { method: "POST" });
        toast("أُلغي الطلب · المتاح الآن " + d.available + " يوماً");

        /* كل ما تأثّر يُبطَل — الرئيسية ومساحتي والموافقات */
        invalidate("requests", "leave", "pending", "decisions");
        await Promise.allSettled([loadRequests(true), loadLeave(true), loadPending(true)]);

        renderNav();
        if (state.route === "requests") {
          renderRequestSummary(); renderRequestFilters(); renderRequestList();
        }
      } catch (e) {
        toast(e.message, "err");
        /* قد يكون الخادم رفض لتغيّر الحالة — نعيد المزامنة */
        invalidate("requests");
        await loadRequests(true).catch(() => {});
        if (state.route === "requests") renderRequestList();
      }
    },
    true
  );
}

/* --- القائمة والبحث --- */

function filterDocs(list, q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return list;
  /* بحث في البيانات الوصفية — الأسئلة الدلالية مكانها المساعد */
  return list.filter(d =>
    String(d.filename).toLowerCase().includes(needle) ||
    String(d.file_type || "").toLowerCase().includes(needle) ||
    fileKind(d).label.toLowerCase().includes(needle) ||
    String(d.uploaded_by || "").toLowerCase().includes(needle));
}

function renderDocs() {
  const host = $("kList");
  if (!host) return;

  const D = resources.docs;
  const counter = $("kCount");

  if (D.state === "loading" || D.state === "idle") {
    host.innerHTML = skeletonCard(3);
    if (counter) counter.textContent = "—";
    return;
  }

  if (D.state === "error") {
    if (counter) counter.textContent = "—";
    host.innerHTML = '<div class="card"><div class="state error">' +
        '<div class="ic" aria-hidden="true">⚠</div>' +
        '<div class="t">تعذّر تحميل المعرفة</div>' +
        '<div class="s">' + esc(D.error) + "</div>" +
        '<button class="btn sm" id="kRetry">إعادة المحاولة</button>' +
      "</div></div>";
    $("kRetry").onclick = async () => {
      host.innerHTML = skeletonCard(3);
      await loadDocs(true);
      if (state.route === "knowledge") renderDocs();
    };
    return;
  }

  const all = D.data || [];
  if (counter) counter.textContent = all.length + " مستنداً";

  if (!all.length) {
    host.innerHTML = '<div class="card">' +
      emptyState("▤", "لا مستندات متاحة",
        isElevated() ? "ارفع مستنداً ليبدأ المساعد بالإجابة منه."
                    : "لم تُضَف مستندات إلى قاعدة المعرفة بعد.") + "</div>";
    return;
  }

  const list = filterDocs(all, docQuery);

  if (!list.length) {
    host.innerHTML = '<div class="card">' +
      emptyState("⌕", "لا مستندات تطابق بحثك",
        'جرّب كلمة أخرى، أو اسأل المساعد عن المحتوى نفسه.',
        '<button class="btn" data-nav="assistant">اسأل المساعد</button>') + "</div>";
    wireNav(host);
    return;
  }

  host.innerHTML =
    '<div class="card pad-0">' +
      '<div class="card-head"><span class="h3 grow">المستندات</span>' +
        '<span class="badge plain">' + list.length +
          (docQuery ? " من " + all.length : "") + "</span></div>" +
      '<div class="table-wrap"><table class="table"><thead><tr>' +
        "<th>النوع</th><th>الاسم</th><th>المقاطع</th><th>رُفع في</th><th>رفعه</th>" +
        '<th class="end">إجراء</th>' +
      "</tr></thead><tbody>" +
        list.map(d => {
          const k = fileKind(d);
          return "<tr>" +
            '<td><span class="badge ' + k.tone + ' plain">' + esc(k.label) + "</span></td>" +
            '<td class="trunc doc-name">' + esc(d.filename) + "</td>" +
            '<td class="sm nowrap">' + d.chunks + "</td>" +
            '<td class="sm nowrap">' + (d.uploaded_at ? fmtStamp(d.uploaded_at) : "—") + "</td>" +
            '<td class="sm nowrap">' + (d.uploaded_by ? esc(d.uploaded_by) : "—") + "</td>" +
            '<td class="end nowrap">' +
              '<button class="btn sm ghost" data-view="' + esc(d.doc_hash) + '">التفاصيل</button>' +
              (isElevated()
                ? '<button class="btn sm ghost danger-text" data-del="' + esc(d.doc_hash) +
                  '">حذف</button>' : "") +
            "</td>" +
          "</tr>";
        }).join("") +
      "</tbody></table></div>" +
    "</div>";

  host.querySelectorAll("[data-view]").forEach(b => {
    b.onclick = () => showDocDetails(b.dataset.view);
  });
  host.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => confirmDeleteDoc(b.dataset.del);
  });
}

const findDoc = hash => (resources.docs.data || []).find(d => d.doc_hash === hash) || null;

/* --- التفاصيل --- */

function showDocDetails(hash) {
  const d = findDoc(hash);
  if (!d) { toast("تعذّر العثور على المستند", "err"); return; }

  const k = fileKind(d);
  const row = (label, value) =>
    '<tr><td class="sm w-label">' + esc(label) + "</td><td>" + value + "</td></tr>";

  /* لا مسارات ولا معرّفات متجهات — البصمة معرّف عام للحذف فقط */
  const body =
    '<div class="table-wrap"><table class="table compact"><tbody>' +
      row("الاسم", esc(d.filename)) +
      row("النوع", '<span class="badge ' + k.tone + ' plain">' + esc(k.label) + "</span>") +
      row("حالة الفهرسة",
          d.chunks ? '<span class="badge approved">مفهرَس</span>'
                   : '<span class="badge pending">بلا محتوى مفهرَس</span>') +
      row("المقاطع المفهرَسة", d.chunks) +
      (d.uploaded_at ? row("رُفع في", fmtStamp(d.uploaded_at)) : "") +
      (d.uploaded_by ? row("رفعه", esc(d.uploaded_by)) : "") +
    "</tbody></table></div>" +

    '<p class="xs mt-5">المقاطع هي الأجزاء التي يبحث فيها المساعد ' +
      "ويستشهد بها عند الإجابة.</p>";

  const wrap = openDialog({
    title: "تفاصيل المستند",
    body: body,
    confirmLabel: isElevated() ? "حذف المستند" : "إغلاق",
    danger: isElevated(),
    onConfirm: async () => {
      closeOverlay();
      if (isElevated()) confirmDeleteDoc(hash);
    },
  });

  if (!isElevated()) {
    wrap.querySelectorAll(".dialog-foot [data-no]").forEach(b => b.remove());
  }
}

/* --- الحذف --- */

function confirmDeleteDoc(hash) {
  const d = findDoc(hash);
  if (!d) return;

  confirmDialog(
    "حذف المستند؟",
    "سيُحذف <b>" + esc(d.filename) + "</b> و" + d.chunks + " مقطعاً من قاعدة معرفة " +
      "المؤسسة، فلن يعود المساعد يجيب منه.<br>لا يمكن التراجع.",
    "حذف",
    async () => {
      try {
        await apiJson("/documents/" + encodeURIComponent(hash), { method: "DELETE" });
        toast("حُذف " + d.filename);
        invalidate("docs");
        await loadDocs(true);
        if (state.route === "knowledge") renderDocs();
      } catch (e) {
        /* يبقى المستند ظاهراً — لا نُخفيه بناءً على فشل */
        toast(e.message, "err");
        invalidate("docs");
        await loadDocs(true).catch(() => {});

function mountUploader() {
  const host = $("kUpload");
  if (!host) return;

  host.innerHTML =
    '<div class="dropzone" id="drop" tabindex="0" role="button" ' +
      'aria-label="رفع مستند">' +
      '<div class="h3">أضف مستنداً</div>' +
      '<div class="xs mt-1">اسحب ملفاً أو اضغط للاختيار · PDF · Word · Excel</div>' +
    "</div>" +
    '<input type="file" id="file" multiple accept=".pdf,.docx,.xlsx" hidden>' +
    '<div id="upStatus" class="stack tight mt-3"></div>';

  const open = () => $("file").click();
  $("drop").onclick = open;
  $("drop").onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
  };
  $("file").onchange = e => { uploadDocs(e.target.files); e.target.value = ""; };

  ["dragenter", "dragover"].forEach(ev =>
    $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
  $("drop").addEventListener("drop", e => uploadDocs(e.dataTransfer.files));
}

/* الخادم يعيد نتيجة نهائية فقط — لا نختلق مراحل "معالجة" و"فهرسة" */
const UPLOAD_RESULT = {
  added:     { tone: "ok",   text: n => "أُضيف · " + n + " مقطعاً" },
  duplicate: { tone: "warn", text: () => "مرفوع مسبقاً — لم يتغيّر شيء" },
  empty:     { tone: "warn", text: () => "لا نص قابل للقراءة في الملف" },
};

async function uploadDocs(files) {
  const status = $("upStatus");
  if (!status || !files || !files.length) return;

  const items = Array.from(files);
  status.innerHTML = items.map((f, i) =>
    '<div class="up-row" id="up-' + i + '">' +
      '<span class="spinner" aria-hidden="true"></span>' +
      '<span class="nm trunc grow">' + esc(f.name) + "</span>" +
      '<span class="st sm">جارٍ الرفع…</span>' +
    "</div>").join("");

  let anyAdded = false;

  for (let i = 0; i < items.length; i++) {
    const f = items[i];
    const row = $("up-" + i);
    const fd = new FormData();
    fd.append("file", f);

    try {
      const d = await apiJson("/documents", { method: "POST", body: fd });
      const r = UPLOAD_RESULT[d.status] || { tone: "warn", text: () => d.status };
      if (d.status === "added") anyAdded = true;
      setUploadRow(row, r.tone, r.text(d.chunks));
    } catch (e) {
      /* رسالة الخادم كما هي — بلا أثر تنفيذ ولا مسارات */
      setUploadRow(row, "err", e.message);
    }
  }

  invalidate("docs");
  await loadDocs(true).catch(() => {});
  if (state.route === "knowledge") renderDocs();

  if (anyAdded) toast("حُدّثت قاعدة المعرفة");
}

function setUploadRow(row, tone, text) {
  if (!row) return;
  const nameNode = row.querySelector(".nm");
  const name = nameNode ? nameNode.textContent : "";
  const mark = { ok: "✓", warn: "!", err: "✕" }[tone] || "·";

  row.className = "up-row " + tone;
  row.innerHTML =
    '<span class="mk" aria-hidden="true">' + mark + "</span>" +
    '<span class="nm trunc grow">' + esc(name) + "</span>" +
    '<span class="st sm">' + esc(text) + "</span>";
}

/* ===================== التنبيهات =====================

   مشتقّة من بيانات محفوظة فعلاً: طلباتي وقراراتها، والطلبات
   المعلّقة للمدير. لا جدول إشعارات ولا سجل مخترَع.

   حالة "مقروء": في الذاكرة لهذي الجلسة فقط. لا يوجد عمود في
   القاعدة يحفظها، ولن نكتبها في localStorage — بيانات طلبات
   الإجازة لا مكان لها في تخزين المتصفح.
*/

const seenAlerts = new Set();

const ALERT_TONE = { ok: "approved", danger: "rejected", warn: "pending", info: "info" };

function buildNotifications() {
  const out = [];
  const R = resources.requests;
  const P = resources.pending;
  const D = resources.decisions;
  const L = resources.leave;

  /* --- للمدير: ما ينتظر قراره --- */
  if (isElevated() && P.state === "ready" && P.data.length) {
    const oldest = P.data[0];
    out.push({
      key: "pending:" + P.data.length,
      tone: "info", icon: "✓",
      title: P.data.length + " طلب بانتظار مراجعتك",
      body: "أقدمها: " + oldest.employee_name + " · " + oldest.days + " أيام",
      at: oldest.start_date || "",
      go: "approvals", label: "مراجعة",
    });
  }

  /* --- قرارات على طلباتي --- */
  if (R.state === "ready") {
    (R.data || []).forEach(r => {
      if (r.status === "approved") {
        out.push({
          key: "req:" + r.id + ":approved",
          tone: "ok", icon: "✓",
          title: "اعتُمد طلب إجازتك",
          body: fmtDate(r.start_date) + " ← " + fmtDate(r.end_date) + " · " + r.days + " أيام" +
                (r.decided_by_name ? " · اعتمده " + r.decided_by_name : ""),
          at: r.decided_at || r.created_at,
          go: "requests", label: "عرض",
        });
      } else if (r.status === "rejected") {
        out.push({
          key: "req:" + r.id + ":rejected",
          tone: "danger", icon: "✕",
          title: "رُفض طلب إجازتك",
          body: (r.rejection_reason || (fmtDate(r.start_date) + " · " + r.days + " أيام")) +
                (r.decided_by_name ? " · " + r.decided_by_name : ""),
          at: r.decided_at || r.created_at,
          go: "requests", label: "عرض",
        });
      } else if (r.status === "pending") {
        out.push({
          key: "req:" + r.id + ":pending",
          tone: "warn", icon: "⋯",
          title: "طلبك قيد المراجعة",
          body: fmtDate(r.start_date) + " ← " + fmtDate(r.end_date) + " · " + r.days + " أيام",
          at: r.created_at,
          go: "requests", label: "متابعة",
        });
      } else if (r.status === "cancelled") {
        out.push({
          key: "req:" + r.id + ":cancelled",
          tone: "info", icon: "—",
          title: "أُلغي طلبك",
          body: fmtDate(r.start_date) + " · " + r.days + " أيام عادت لرصيدك",
          at: r.created_at,
          go: "requests", label: "عرض",
        });
      }
    });
  }

  /* --- للمدير: قراراته الأخيرة --- */
  if (isElevated() && D.state === "ready") {
    (D.data || []).slice(0, 5).forEach(d => {
      out.push({
        key: "dec:" + d.id,
        tone: d.status === "approved" ? "ok" : "danger",
        icon: d.status === "approved" ? "✓" : "✕",
        title: (d.status === "approved" ? "اعتمدتَ طلب " : "رفضتَ طلب ") + d.employee_name,
        body: fmtDate(d.start_date) + " ← " + fmtDate(d.end_date) + " · " + d.days + " أيام",
        at: d.decided_at || d.created_at,
        go: "approvals", label: "الموافقات",
      });
    });
  }

  /* --- رصيد منخفض --- */
  if (L.state === "ready" && L.data && L.data.available <= 2) {
    out.push({
      key: "balance:" + L.data.available,
      tone: "warn", icon: "!",
      title: "رصيد إجازتك منخفض",
      body: "المتاح " + L.data.available + " يوماً فقط من " + L.data.annual_leave + ".",
      at: "",
      go: "workspace", label: "التفاصيل",
    });
  }

  out.sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
  return out;
}

function renderAlerts() {

  if (!host) return;

  const items = buildNotifications();

  $("pgActions").innerHTML = unread
    ? '<button class="btn ghost sm" id="alMarkAll">تعليم الكل كمقروء</button>'
    : "";

  if (!items.length) {
    host.innerHTML =
      (failed.length ? partialWarning(failed) : "") +
      '<div class="card">' +
        emptyState("◔", "لا تنبيهات",
          "سنخبرك فور تغيّر شيء يخصّك — قرار على طلبك أو طلب ينتظر مراجعتك.") +
      "</div>";
    renderNav();
    return;

  host.innerHTML =
    (failed.length ? partialWarning(failed) : "") +
    '<div class="card pad-0">' +
      '<div class="card-head"><span class="h3 grow">التنبيهات</span>' +
        (unread ? '<span class="badge accent">' + unread + " جديد</span>" : "") +
        '<span class="badge plain">' + items.length + "</span></div>" +
      '<ul class="al-list">' +
        items.map(n =>
          '<li class="al-item' + (seenAlerts.has(n.key) ? " seen" : "") + '">' +
            '<span class="badge ' + ALERT_TONE[n.tone] + ' plain" aria-hidden="true">' +
              n.icon + "</span>" +
            '<div class="grow">' +
              '<div class="h3">' + esc(n.title) + "</div>" +
              '<div class="xs mt-1">' + esc(n.body) + "</div>" +
              (n.at ? '<div class="at">' + fmtStamp(n.at) + "</div>" : "") +
            "</div>" +
            '<button class="btn sm ghost" data-nav="' + n.go + '" data-key="' + esc(n.key) + '">' +
              esc(n.label) + "</button>" +
          "</li>").join("") +
      "</ul>" +
    "</div>";

  host.querySelectorAll("[data-key]").forEach(b => {
    b.onclick = () => {
      seenAlerts.add(b.dataset.key);
      renderNav();
      go(b.dataset.nav);
    };
  });

  if ($("alMarkAll")) {
    $("alMarkAll").onclick = () => {
      buildNotifications().forEach(n => seenAlerts.add(n.key));
      renderAlerts();
      renderNav();
    };
  }

  renderNav();
}

function renderTeamAttendance() {
  const host = $("tmAttendance");
  if (!host) return;

  const A = resources.teamAtt;
  if (A.state === "loading" || A.state === "idle") {
    host.innerHTML = skeletonCard(3); return;
  }
  if (A.state === "error") { host.innerHTML = errorState(A.error); return; }

  const rows = A.data || [];
  if (!rows.length) {
    host.innerHTML = emptyState("◷", "لا سجلّ حضور",
      "لم يسجّل أحد من فريقك حضوراً خلال ثلاثين يوماً.");
    return;
  }

  /* تجميع لكل موظف: المدير يحتاج من داوم وكم، لا تتبّعاً
     ساعةً بساعة لكل فرد. والتفصيل في سجلّ الموظف نفسه. */
  const byEmp = {};
  rows.forEach(r => {
    const k = r.employee_id;
    if (!byEmp[k]) byEmp[k] = { name: r.employee_name || k, n: 0, open: false };
    byEmp[k].n += 1;
    if (!r.check_out_at) byEmp[k].open = true;
  });

  const entries = Object.entries(byEmp).sort((a, b) => b[1].n - a[1].n);

function reviewCorrection(cid, decision) {
  const approving = decision === "approve";
  confirmDialog(
    approving ? "اعتماد التصحيح" : "رفض التصحيح",
    '<p>' + (approving
      ? "سيُطبَّق التصحيح على سجل الحضور فوراً."
      : "سيُرفض الطلب ولن يتغيّر السجل.") + "</p>" +
    '<label class="field mt-2"><span class="lb">ملاحظة (اختيارية)</span>' +
      '<input id="cxNote" class="in" maxlength="300"></label>',
    approving ? "اعتماد" : "رفض",
    async () => {
      try {
        await apiJson("/attendance/corrections/" + cid + "/review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            decision: decision,
            note: ($("cxNote") && $("cxNote").value.trim()) || "",
          }),
        });
        toast(approving ? "اعتُمد التصحيح" : "رُفض الطلب", "ok");
        await Promise.allSettled([
          loadCorrections(true).catch(() => resources.corrects),
          loadTeamAttendance(true).catch(() => resources.teamAtt),
        ]);
        if (state.route === "team") {
          renderTeamCorrections(); renderTeamAttendance();
        }
      } catch (e) {
        /* 403 هنا يعني فصل المهام: صاحب الطلب لا يراجعه.
           النصّ من الخادم لا من عندنا. */
        toast(e.message, "err");
        return false;
      }
    },
    !approving,
  );
}

/* نستبعد الأزواج غير المكتملة — سؤال محجوب لا يتسلّل كسياق */
function buildMessages(question) {
  const s = current();
  const past = s ? s.messages.slice(0, -2) : [];
  const msgs = [];
  for (let i = 0; i < past.length - 1; i++) {
    const u = past[i], a = past[i + 1];
    if (u.role !== "user" || a.role !== "assistant") continue;
    if (!a.text || !a.text.trim() || a.blocked) continue;
    msgs.push({ role: "user", content: u.text });
    msgs.push({ role: "assistant", content: a.text });
    i++;
  }
  msgs.push({ role: "user", content: question });
  return msgs;
}

async function askAgent(question, onDelta, onTools, onSources) {
  const res = await api("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages: buildMessages(question) }),
  });

  if (!res.ok) {
    let detail = "خطأ " + res.status;
    try { const j = await res.json(); detail = j.detail || detail; } catch (e) {}
    const err = new Error(detail);
    err.blocked = res.status === 400;
    throw err;
  }
  if (!res.body) throw new Error("لم يصل ردّ من الخادم");

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let acc = "", buf = "";

  for (;;) {
    const chunk = await reader.read();
    if (chunk.done) break;
    buf += dec.decode(chunk.value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();

    for (const line of lines) {
      if (line.indexOf("data:") !== 0) continue;
      const raw = line.slice(5).trim();
      if (!raw || raw === "[DONE]") continue;
      let p = null;
      try { p = JSON.parse(raw); } catch (e) { acc += raw; onDelta(acc); continue; }

      if (p.event === "tools") onTools(p.tools);
      else if (p.event === "sources") onSources(p.sources);
      else if (p.delta) { acc += p.delta; onDelta(acc); }
    }
  }
  return acc;
}

async function askDocs(question) {
  return apiJson("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: question }),
  });
}

async function run(question) {
  if (state.busy) return;
  if (state.route !== "assistant") { pendingQuestion = question; return go("assistant"); }

  state.busy = true;
  const btn = $("send");
  if (btn) btn.disabled = true;

  let s = current();
  if (!s) s = newSession();
  if (!s.messages.length) s.title = question.slice(0, 44);

  s.messages.push({ role: "user", text: question, ts: timeNow() });
  const reply = { role: "assistant", text: "", tools: [], sources: [], ts: timeNow() };
  s.messages.push(reply);

  const idx = s.messages.length - 1;
  renderThread();

  const node = sel => {
    const t = $("thread").querySelector('[data-idx="' + idx + '"]');
    return t ? t.querySelector(sel) : null;
  };

  try {
    if (state.mode === "agent") {
      reply.text = await askAgent(
        question,
        acc => { const n = node(".answer"); if (n) { n.textContent = acc; scrollDown(); } },
        tl => {
          reply.tools = tl;
          const n = node(".steps") || node(".answer");
          renderThread();
        },
        sr => { reply.sources = sr; }
      );
    } else {
      const d = await askDocs(question);
      reply.text = d.answer;
      reply.sources = d.sources || [];
    }
    if (!reply.text.trim()) reply.text = "لم تصل إجابة من الخادم.";
    if (!reply.tools.length && !reply.sources.length) reply.blocked = true;
  } catch (e) {
    reply.text = (e.blocked ? "" : "تعذّر إتمام الطلب: ") + e.message;
    reply.blocked = true;
  }

  saveSessions();
  renderThread();

  /* عملية كتابة قد تكون غيّرت الطلبات المعلّقة — نحدّث العدّاد */
  const WRITE = ["submit_leave_request", "cancel_leave_request", "review_leave_request"];
  if (reply.tools.some(t => WRITE.includes(t))) {
    invalidate("pending", "requests", "leave", "decisions");
    try { await loadPending(true); renderNav(); } catch (e) { /* العدّاد ليس حرجاً */ }
  }

  state.busy = false;
  if ($("send")) $("send").disabled = false;
  if ($("input")) $("input").focus();
}

function regenerate() {
  const s = current();
  if (!s || state.busy) return;
  let lastUser = null;
  for (let i = s.messages.length - 1; i >= 0; i--) {
    if (s.messages[i].role === "user") { lastUser = s.messages[i]; break; }
  }
  if (!lastUser) return;
  const la = s.messages.map(m => m.role).lastIndexOf("assistant");
  if (la > -1) s.messages.splice(la, 1);
  const lu = s.messages.map(m => m.role).lastIndexOf("user");
  if (lu > -1) s.messages.splice(lu, 1);
  renderThread();
  run(lastUser.text);
}

function send() {
  const box = $("input");
  const q = box.value.trim();
  if (!q) return;
  box.value = "";
  box.style.height = "auto";
  run(q);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("تم النسخ"); return; } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("تم النسخ"); }
  catch (e) { toast("تعذّر النسخ", "err"); }
  ta.remove();
}

function exportChat() {
  const s = current();
  if (!s || !s.messages.length) { toast("لا محادثة لتصديرها", "err"); return; }

  const lines = ["# " + s.title, "", "*" + new Date(s.ts).toLocaleString("ar-SA") + "*", ""];
  for (const m of s.messages) {
    if (m.role === "user") { lines.push("## سؤال", "", m.text, ""); continue; }
    lines.push("### إجابة", "", m.text, "");
    if (m.tools && m.tools.length) lines.push("**المصادر المستخدمة:** " + m.tools.map(toolDone).join("، "), "");
    if (m.sources && m.sources.length) {
      lines.push("**المراجع:**", "");
      m.sources.forEach((src, i) =>
        lines.push((i + 1) + ". " + (src.doc || src.source) + " — " + (src.chunk || src.location)));
      lines.push("");
    }
    lines.push("---", "");
  }

  const url = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = "محادثة-" + s.id + ".md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast("تم التصدير");
}

/* شجرة التبعية — استدعاء ذاتي بعمق محدود.
   MAX_CHAIN_DEPTH في org.py هو 32 ويرفض الحلقات، لكن الواجهة لا
   تفترض سلامة ما يصل: نوقف العرض عند 16 مستوى بدل أن ننهار. */
const ORG_MAX_DEPTH = 16;

function orgTree(nodes, depth) {
  if (!Array.isArray(nodes) || depth > ORG_MAX_DEPTH) return "";

  return nodes.map(n => {
    const kids = Array.isArray(n.reports) ? n.reports : [];
    const inactive = n.employment_status && n.employment_status !== "active";

    return '<div class="row" style="padding-inline-start:' + (depth * 18) + 'px">' +
        '<span class="xs">' + (depth ? "└" : "●") + "</span>" +
        '<span class="sm">' + esc(n.name) +
          (inactive ? ' <span class="badge cancelled">' + esc(n.employment_status) +
                      "</span>" : "") +
        "</span>" +
        /* المسمّى يلاصق الاسم؛ الفراغ يدفع الشارة وحدها إلى الطرف */
        (n.job_title ? '<span class="xs">· ' + esc(n.job_title) + "</span>" : "") +
        '<span class="grow"></span>' +
        (kids.length ? '<span class="badge info">' + kids.length + "</span>" : "") +
      "</div>" +
      orgTree(kids, depth + 1);
  }).join("");
}

        '<div class="table-wrap"><table class="table"><tbody>' +
          '<tr><td class="sm w-label">الاسم</td><td>' + esc(u.name || "") + "</td></tr>" +
          '<tr><td class="sm">الرقم الوظيفي</td><td class="ltr">' + esc(u.id || "—") + "</td></tr>" +
          '<tr><td class="sm">الصلاحية</td><td>' + roleBadge() + "</td></tr>" +
        "</tbody></table></div>" +
      "</div>" +

      '<div class="card">' +
        '<div class="h3">المظهر</div>' +
        '<div class="sm mb">اختر مظهر الواجهة.</div>' +
        '<div class="seg w-seg">' +
          '<button id="thDark">داكن</button><button id="thLight">فاتح</button></div>' +
      "</div>" +

      /* /auth/users صار is_admin في الخطوة 1 — فالمدير لا يرى الصندوق
         بدل أن يراه ويصطدم بـ403 */
      (isAdmin() ? '<div id="usersBox">' + skeletonCard(2) + "</div>" : "") +

      '<div class="card">' +
        '<div class="h3">الجلسة</div>' +
        '<div class="sm mb">تنتهي الجلسة تلقائياً بعد فترة.</div>' +
        '<button class="btn ghost" id="setLogout">تسجيل الخروج</button>' +
      "</div>" +

    "</div></div>";
  },

  mount() {
    const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    $("thDark").classList.toggle("on", cur === "dark");
    $("thLight").classList.toggle("on", cur === "light");
    $("thDark").onclick = () => { setTheme("dark"); PAGES.settings.mount(); };
    $("thLight").onclick = () => { setTheme("light"); PAGES.settings.mount(); };
    $("setLogout").onclick = () => signOut();

    if (isAdmin()) {
      $("pgActions").innerHTML = '<button class="btn primary sm" id="addUser">حساب جديد</button>';
      $("addUser").onclick = showAddUser;
      refreshUsers();
    }
  },
};

const roleBadge = () => roleChip(state.user && state.user.role);

async function refreshUsers() {
  const box = $("usersBox");
  if (!box) return;

  let list;
  try { list = await apiJson("/auth/users"); }
  catch (e) { box.innerHTML = errorState(e.message); return; }

  box.innerHTML =
    '<div class="card pad-0">' +
      '<div class="card-head"><span class="h3 grow">المستخدمون</span>' +
        '<span class="badge plain">' + list.length + "</span></div>" +
      '<div class="table-wrap"><table class="table"><thead><tr>' +
        "<th>الاسم</th><th>اسم الدخول</th><th>الرقم الوظيفي</th><th>الصلاحية</th>" +
        '<th class="end"></th></tr></thead><tbody>' +
        list.map(u =>
          "<tr>" +
            "<td>" + esc(u.employee_name) + "</td>" +
            '<td class="ltr sm">' + esc(u.username) + "</td>" +
            '<td class="ltr sm">' + esc(u.employee_id) + "</td>" +
            "<td>" + roleChip(u.role) + "</td>" +
            '<td class="end">' + (u.employee_name === (state.user && state.user.name) ? ""
              : '<button class="btn sm ghost" data-du="' + esc(u.username) + '">حذف</button>') + "</td>" +
          "</tr>").join("") +
      "</tbody></table></div>" +
    "</div>";

  box.querySelectorAll("[data-du]").forEach(b => {
    b.onclick = () => confirmDialog(
      "حذف الحساب",
      'سيُحذف حساب <b class="ltr">' + esc(b.dataset.du) + "</b> ولن يتمكّن من الدخول.",
      "حذف",
      async () => {
        try {
          await apiJson("/auth/users/" + encodeURIComponent(b.dataset.du), { method: "DELETE" });
          toast("حُذف الحساب");
          refreshUsers();
        } catch (e) { toast(e.message, "err"); }
      }, true);
  });
}

function showAddUser() {
  let role = "employee";

  openDialog({
    title: "حساب جديد",
    body:
      '<div class="field"><label class="label" for="nuName">الاسم الكامل</label>' +
        '<input class="input" id="nuName" placeholder="سعد الغامدي"></div>' +
      '<div class="field"><label class="label" for="nuUser">اسم الدخول</label>' +
        '<input class="input ltr" id="nuUser" placeholder="saad"></div>' +
      '<div class="field"><label class="label">الصلاحية</label>' +
        '<div class="seg"><button id="nuEmp" class="on">موظف</button>' +
        '<button id="nuMgr">مدير</button></div></div>' +
      '<div id="nuOut"></div>',
    confirmLabel: "إنشاء",
    keepOpen: true,
    onReady: () => {
      const set = r => {
        role = r;
        $("nuEmp").classList.toggle("on", r === "employee");
        $("nuMgr").classList.toggle("on", r === "manager");
      };
      $("nuEmp").onclick = () => set("employee");
      $("nuMgr").onclick = () => set("manager");
    },
    onConfirm: async () => {
      const name = $("nuName").value.trim();
      const username = $("nuUser").value.trim().toLowerCase();
      const out = $("nuOut");

      if (name.length < 2 || username.length < 2) {
        out.innerHTML = noticeCard("أدخل الاسم الكامل واسم الدخول.", "danger");
        return false;
      }

      try {
        const d = await apiJson("/auth/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, employee_name: name, role: role }),
        });
        out.innerHTML =
          '<div class="card notice ok">' +
            '<div class="h3">أُنشئ الحساب: ' + esc(d.employee_name) + "</div>" +
            '<div class="cred"><span class="ltr">' + esc(d.username) + "</span>" +
              '<span class="ltr strong-mono">' + esc(d.password) + "</span></div>" +
            '<div class="xs">' + esc(d.note) + "</div>" +
          "</div>";
        $("nuName").value = ""; $("nuUser").value = "";
        refreshUsers();
      } catch (e) {
        out.innerHTML = noticeCard(e.message, "danger");
      }
      return false;
    },
    focus: "nuName",
  });
}

const noticeCard = (msg, kind) =>
  '<div class="card notice ' + (kind || "") + '"><div class="sm">' + esc(msg) + "</div></div>";

/* ===================== الدخول والخروج ===================== */

function showLogin(message) {
  $("login").hidden = false;
  $("shell").hidden = true;
  document.body.classList.remove("nav-open");

  const err = $("lgErr");
  if (message) { err.innerHTML = noticeCard(message, "danger"); err.hidden = false; }
  else { err.hidden = true; err.innerHTML = ""; }

  $("lgUser").focus();
}

function showApp() {
  $("login").hidden = true;
  $("shell").hidden = false;

  const u = state.user;
  $("whoName").textContent = u.name;
  $("whoRole").textContent = roleLabel(u.role);
  $("avatar").textContent = (u.name || "?").trim().charAt(0);

  const start = location.hash.replace("#", "") || "home";
  go(ROUTES[start] ? start : "home");

  /* عدّاد الموافقات مشتقّ من بيانات حقيقية */
  loadPending().then(() => { renderNav(); renderBell(); }).catch(() => {});

  refreshConnection();
  if (!state.connTimer) {
    state.connTimer = setInterval(() => { if (state.token) refreshConnection(); }, 30000);
  }
}

function signOut(message) {
  state.token = "";
  state.user = null;
  state.pending = [];
  state.pendingCount = 0;
  resetResources();
  store.set("token", "");
  store.set("user", null);
  closeOverlay();
  showLogin(message);
}

async function signIn() {
  const username = $("lgUser").value.trim();
  const password = $("lgPass").value;
  if (!username || !password) { showLogin("أدخل اسم المستخدم وكلمة المرور."); return; }

  const btn = $("lgGo");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جارٍ الدخول…';

  try {
    const res = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || "تعذّر تسجيل الدخول");

    state.token = d.token;
    /* /auth/login يعيد أربعة حقول؛ /auth/me يعيد أحد عشر.
       نثبّت الهوية الأساسية أولاً ثم نُثريها، فيتساوى مسار
       الدخول مع مسار الإقلاع ولا تتفرّع الواجهة على نقص حقل. */
    state.user = adoptUser({ name: d.name, role: d.role, id: d.employee_id });
    store.set("token", state.token);
    await refreshMe();

    $("lgPass").value = "";
    showApp();
    toast("أهلاً " + d.name);
  } catch (e) {
    showLogin(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "دخول";
  }
}

/* ===================== الربط ===================== */

$("lgGo").onclick = signIn;
["lgUser", "lgPass"].forEach(id => {
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });
});

$("logout").onclick = () => signOut();
$("menuBtn").onclick = () => document.body.classList.toggle("nav-open");
$("alertsBtn").onclick = () => go("alerts");

function renderBell() {
  const btn = $("alertsBtn");
  if (!btn) return;
  const n = typeof unreadCount === "function" ? unreadCount() : 0;
  btn.innerHTML = "◔" + (n ? '<span class="dot">' + (n > 9 ? "9+" : n) + "</span>" : "");
  btn.setAttribute("aria-label", n ? n + " تنبيه غير مقروء" : "التنبيهات");
}

$("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  setTheme(cur === "light" ? "dark" : "light");
};

function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  store.set("theme", t);
  const b = $("themeBtn");
  if (b) b.title = t === "light" ? "التبديل للداكن" : "التبديل للفاتح";
}

document.addEventListener("click", e => {
  if (document.body.classList.contains("nav-open") &&
      !e.target.closest("nav.side") && !e.target.closest("#menuBtn")) {
    closeNav();
  }
});

async function refreshConnection() {
  const box = $("conn");
  if (!box) return;
  try {
    const d = await apiJson("/health");
    box.className = "status ok";
    box.innerHTML = '<i></i><span>متصل · ' + d.chunks + ' مقطعاً</span>';
  } catch (e) {
    box.className = "status bad";
    box.innerHTML = '<i></i><span>تعذّر الاتصال بالخادم</span>';
  }
}


/* ===================== الإقلاع ===================== */

setTheme(store.get("theme", "dark"));

(async function boot() {
  if (!state.token) { showLogin(); return; }
  try {
    if (!await refreshMe()) throw new Error();
    showApp();
  } catch (e) {
    signOut();
  }
})();

</script>
</body>
</html>
